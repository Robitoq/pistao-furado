name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escrever build.gradle.kts do app (chave fixa)
        run: |
          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.ferrovelho.game"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ferrovelho.game"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
                  versionName = "0.2"
              }

              // Chave fixa: todo APK novo usa a mesma assinatura e atualiza por cima do instalado.
              signingConfigs {
                  create("fixa") {
                      storeFile = file("../ferrovelho.jks")
                      storePassword = "ferrovelho123"
                      keyAlias = "ferrovelho"
                      keyPassword = "ferrovelho123"
                  }
              }

              buildTypes {
                  debug { signingConfig = signingConfigs.getByName("fixa") }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("fixa")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
          }
          EOT
      - name: Conferir arquivos do projeto
        run: |
          ERRO=0
          G=app/src/main/java/com/ferrovelho/game
          chk() { if ! grep -q "$2" "$1" 2>/dev/null; then echo "VELHO OU FALTANDO: $1 ($3)"; ERRO=1; fi; }
          test -f ferrovelho.jks || { echo "FALTA ferrovelho.jks na raiz do repositorio"; ERRO=1; }
          test -f app/src/main/res/drawable-anydpi-v26/ic_launcher.xml || { echo "FALTA o icone novo (res/drawable-anydpi-v26)"; ERRO=1; }
          chk app/src/main/AndroidManifest.xml 'Pistão Furado' "nome do jogo"
          chk $G/Interior.kt 'val gb = false' "filtro verde"
          chk $G/City.kt 'VIEW_W - 4f' "correcao do crash e botao Visual"
          chk $G/Dialog.kt 'shade(look.hair' "boneco novo do dialogo"
          chk $G/MainActivity.kt 'sem tela de erro' "sem tela de erro"
          echo "---- arquivos em $G ----"
          ls -la $G
          exit $ERRO
      - name: Garantir build.gradle.kts da raiz
        run: |
          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PistaoFurado-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PistaoFurado.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pistão Furado v${{ github.run_number }}
          files: PistaoFurado.apk
          make_latest: true
