name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escrever build.gradle.kts do app (chave fixa)
        run: |
          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.ferrovelho.game"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.ferrovelho.game"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
                  versionName = "0.2"
              }

              // Chave fixa: todo APK novo usa a mesma assinatura e atualiza por cima do instalado.
              signingConfigs {
                  create("fixa") {
                      storeFile = file("../ferrovelho.jks")
                      storePassword = "ferrovelho123"
                      keyAlias = "ferrovelho"
                      keyPassword = "ferrovelho123"
                  }
              }

              buildTypes {
                  debug { signingConfig = signingConfigs.getByName("fixa") }
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("fixa")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
          }
          EOT
      - name: Arrumar arquivos novos que subiram no lugar errado
        run: |
          G=app/src/main/java/com/ferrovelho/game
          # apaga restos com .txt
          rm -f $G/*.kt.txt $G/build.gradle.kts.txt app/build.gradle.kts.txt
          # se o arquivo novo estiver solto na raiz, move pro lugar certo
          fix() {
            if [ -f "$1" ] && grep -qF "$3" "$1" && ! grep -qF "$3" "$2" 2>/dev/null; then
              mkdir -p "$(dirname "$2")"
              cp "$1" "$2"
              echo "Arrumado: $1 -> $2"
            fi
          }
          fix City.kt          $G/City.kt          'VIEW_W - 4f'
          fix Interior.kt      $G/Interior.kt      'val gb = false'
          fix Dialog.kt        $G/Dialog.kt        'shade(look.hair'
          fix MainActivity.kt  $G/MainActivity.kt  'sem tela de erro'
          fix AndroidManifest.xml app/src/main/AndroidManifest.xml 'Pistão Furado'
          # icone novo (pistao furado)
          mkdir -p app/src/main/res/drawable app/src/main/res/drawable-anydpi-v26
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#14161F"
                  android:pathData="M24,0 h60 a24,24 0 0 1 24,24 v60 a24,24 0 0 1 -24,24 h-60 a24,24 0 0 1 -24,-24 v-60 a24,24 0 0 1 24,-24 z" />
              <path
                  android:fillColor="#1F2333"
                  android:pathData="M7,54 a47,47 0 1,0 94,0 a47,47 0 1,0 -94,0 Z" />
              <path
                  android:fillColor="#C5CCD6"
                  android:pathData="M35,16 h38 a7,7 0 0 1 7,7 v58 a7,7 0 0 1 -7,7 h-38 a7,7 0 0 1 -7,-7 v-58 a7,7 0 0 1 7,-7 z" />
              <path
                  android:fillColor="#9AA3B0"
                  android:pathData="M28,26 h9 v56 h-9 z" />
              <path
                  android:fillColor="#EEF2F7"
                  android:pathData="M33,19 h42 v3 h-42 z" />
              <path
                  android:fillColor="#3A4150"
                  android:pathData="M28,30 h52 v3.2 h-52 z" />
              <path
                  android:fillColor="#3A4150"
                  android:pathData="M28,37 h52 v3.2 h-52 z" />
              <path
                  android:fillColor="#3A4150"
                  android:pathData="M28,44 h52 v3.2 h-52 z" />
              <path
                  android:fillColor="#FF6B1A"
                  android:pathData="M40,66 a14,14 0 1,0 28,0 a14,14 0 1,0 -28,0 Z" />
              <path
                  android:fillColor="#0D0E14"
                  android:pathData="M43,66 a11,11 0 1,0 22,0 a11,11 0 1,0 -22,0 Z" />
              <path
                  android:fillColor="#FFB020"
                  android:pathData="M54,73 L48.5,70 L50,64 L53,66 L52.5,59 L59.5,64 L59.5,70 L58,73.5 Z" />
              <path
                  android:fillColor="#3A4150"
                  android:pathData="M50.4,83 a3.6,3.6 0 1,0 7.2,0 a3.6,3.6 0 1,0 -7.2,0 Z" />
              <path
                  android:strokeColor="#3A4150"
                  android:strokeWidth="1.8"
                  android:strokeLineCap="round"
                  android:pathData="M54,52 L51,47" />
              <path
                  android:strokeColor="#3A4150"
                  android:strokeWidth="1.8"
                  android:strokeLineCap="round"
                  android:pathData="M65,59 L72,55" />
              <path
                  android:strokeColor="#3A4150"
                  android:strokeWidth="1.8"
                  android:strokeLineCap="round"
                  android:pathData="M43,60 L35,57" />
              <path
                  android:strokeColor="#3A4150"
                  android:strokeWidth="1.8"
                  android:strokeLineCap="round"
                  android:pathData="M64,75 L70,80" />
          </vector>
          EOT
          cp app/src/main/res/drawable/ic_launcher.xml app/src/main/res/drawable-anydpi-v26/ic_launcher.xml
          echo "---- conferencia ----"
          grep -c 'val gb = false' $G/Interior.kt || true
          grep -c 'VIEW_W - 4f' $G/City.kt || true
          grep -c 'Pistão Furado' app/src/main/AndroidManifest.xml || true
      - name: Garantir build.gradle.kts da raiz
        run: |
          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PistaoFurado-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PistaoFurado.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pistão Furado v${{ github.run_number }}
          files: PistaoFurado.apk
          make_latest: true
