name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar arquivos enviados na raiz
        run: |
          G=app/src/main/java/com/ferrovelho/game
          [ -f Dialog.kt ] && cp Dialog.kt $G/Dialog.kt
          [ -f CarArt.kt ] && cp CarArt.kt $G/CarArt.kt
          [ -f app_build.gradle.kts ] && cp app_build.gradle.kts app/build.gradle.kts
          ls -la ferrovelho.jks
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FerroVelho-APK
          path: app/build/outputs/apk/debug/app-debug.apk
