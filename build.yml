name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir arquivos do projeto
        run: |
          test -f ferrovelho.jks || { echo "FALTA ferrovelho.jks na raiz do repositorio"; exit 1; }
          grep -q 'create("fixa")' app/build.gradle.kts || { echo "FALTA a chave fixa em app/build.gradle.kts"; exit 1; }
          grep -q 'Pistão Furado' app/src/main/AndroidManifest.xml || { echo "FALTA o nome Pistão Furado no AndroidManifest"; exit 1; }
          grep -q 'val gb = false' app/src/main/java/com/ferrovelho/game/Interior.kt || { echo "Interior.kt antigo (filtro verde ainda ligado)"; exit 1; }
          grep -q 'VIEW_W - 4f' app/src/main/java/com/ferrovelho/game/City.kt || { echo "City.kt antigo (correcao do crash ausente)"; exit 1; }
      - name: Garantir build.gradle.kts da raiz
        run: |
          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PistaoFurado-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PistaoFurado.apk
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Pistão Furado v${{ github.run_number }}
          files: PistaoFurado.apk
          make_latest: true
